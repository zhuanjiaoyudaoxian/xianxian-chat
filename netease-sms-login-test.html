<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>网易云短信登录测试</title><style>body{font:16px -apple-system,system-ui,sans-serif;background:#f7f6f4;color:#222;margin:0;padding:20px}main{max-width:540px;margin:auto}section{background:white;border:1px solid #e7e4e0;border-radius:18px;padding:20px;margin:16px 0}h1{font-size:22px}p{line-height:1.7;color:#666}label{display:block;margin:14px 0 6px}input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #bbb;border-radius:10px;font-size:16px}button{background:#252525;color:white;border:0;border-radius:10px;padding:12px 16px;margin:12px 8px 0 0;font-size:15px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f5f3;padding:12px;border-radius:10px}</style></head><body><main><h1>网易云短信登录测试（实验版）</h1><p>仅在你自己的 GitHub Pages 域名下使用。仅支持中国大陆手机号。验证码可能因网易云风控而无法发送或登录。不要把密钥、验证码或手机号发给别人。</p><section><label for="token">Render 的 MUSIC_AUTH_TOKEN</label><input type="password" id="token" autocomplete="off"><label for="phone">网易云绑定的手机号</label><input type="tel" id="phone" inputmode="numeric" autocomplete="tel"><button id="send">发送验证码</button><label for="code">短信验证码</label><input id="code" type="text" inputmode="numeric" autocomplete="one-time-code"><button id="verify">验证并登录</button><pre id="out" aria-live="polite">等待操作</pre></section><section><button id="profile">读取账号信息</button><button id="playlists">读取我的歌单</button><pre id="result" aria-live="polite">等待操作</pre></section></main><script>
const BASE='https://weiwei-netease-python.onrender.com';const $=id=>document.getElementById(id);function show(id,s){$(id).textContent=s}
async function call(path,body){const token=$('token').value.trim();if(!token)throw Error('请先填写 Render 的 MUSIC_AUTH_TOKEN');const opt={method:body?'POST':'GET',headers:{'X-Auth-Token':token},cache:'no-store'};if(body){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body)}let r;try{r=await fetch(BASE+path,opt)}catch(e){throw Error('网络请求失败：'+e.message)}let d;try{d=await r.json()}catch{throw Error('服务没有返回 JSON（HTTP '+r.status+'）')}if(!r.ok||d.ok===false)throw Error('HTTP '+r.status+'：'+(d.error||d.message||'请求失败')+(d.code?'（代码 '+d.code+'）':''));return d}
$('send').onclick=async()=>{show('out','正在请求验证码…');try{let d=await call('/music/netease/login/sms/send',{phone:$('phone').value.trim()});show('out',d.message||'请求已提交；不保证短信一定送达')}catch(e){show('out',e.message)}};
$('verify').onclick=async()=>{show('out','正在验证…');try{let d=await call('/music/netease/login/sms/verify',{phone:$('phone').value.trim(),captcha:$('code').value.trim()});$('code').value='';show('out','登录成功！昵称：'+(d.nickname||'未返回')+'\n账号 ID：'+d.userId)}catch(e){$('code').value='';show('out',e.message)}};
$('profile').onclick=async()=>{show('result','正在读取…');try{show('result',JSON.stringify(await call('/music/netease/profile'),null,2))}catch(e){show('result',e.message)}};
$('playlists').onclick=async()=>{show('result','正在读取…');try{show('result',JSON.stringify(await call('/music/netease/playlists'),null,2))}catch(e){show('result',e.message)}};
</script></body></html>
