<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>小手机</title>
<style>:root{--bg:#f5f1e8;--card:#fffdf8;--ink:#183c32;--accent:#c9a86a;--muted:#718078;--danger:#b04a4a}*{box-sizing:border-box}body{margin:0;background:#ddd;font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:var(--ink)}#app{max-width:520px;margin:auto;height:100dvh;background:var(--bg);overflow:hidden;position:relative}.screen{display:none;height:100%;overflow:auto;padding:18px 16px 74px}.screen.active{display:block}.lock{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(150deg,#183c32,#345e4c);color:#fff}.lock h1{font-size:72px;margin:0}.lock button{margin-top:30px}.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}.top h2{margin:0;flex:1}.btn,button{border:0;border-radius:12px;background:var(--accent);color:#172c25;padding:11px 14px;font-size:15px;cursor:pointer}.ghost{background:transparent;border:1px solid var(--accent)}.danger{background:#efc2c2;color:#762d2d}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tile{background:var(--card);border:1px solid #e5dccb;border-radius:18px;padding:18px 8px;text-align:center;min-height:88px;font-size:14px}.tile b{display:block;font-size:27px;margin-bottom:7px}.homefoot{text-align:center;color:var(--muted);margin-top:18px}.card{background:var(--card);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 2px 8px #183c3210}input,textarea,select{width:100%;padding:11px;border:1px solid #d9cfbd;border-radius:10px;background:#fffdf8;color:var(--ink);font:inherit}textarea{min-height:76px;resize:vertical}label{display:block;font-size:13px;color:var(--muted);margin:10px 0 5px}.chat{min-height:60dvh}.bubble{max-width:82%;padding:10px 13px;border-radius:16px;margin:8px 0;white-space:pre-wrap}.them{background:#fff; margin-right:auto;border-bottom-left-radius:4px}.me{background:#d5ead2;margin-left:auto;border-bottom-right-radius:4px}.meta{font-size:11px;color:var(--muted);margin-top:3px}.bar{position:absolute;bottom:0;left:0;right:0;background:var(--card);display:flex;justify-content:space-around;padding:10px;border-top:1px solid #e4dac8}.bar button{background:transparent;padding:8px;font-size:12px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}.small{font-size:12px;color:var(--muted)}.hidden{display:none}</style></head>
<body><div id="app"><section id="lock" class="screen lock active"><div class="small" id="date"></div><h1 id="clock">00:00</h1><p id="lockQuote">把想说的话，留在这里。</p><button onclick="show('home')">点击进入</button></section>
<section id="home" class="screen"><div class="top"><h2>小手机</h2><button class="ghost" onclick="show('lock')">锁屏</button></div><div class="grid" id="grid"></div><p class="homefoot" id="homefoot"></p></section>
<section id="chat" class="screen"><div class="top"><button class="ghost" onclick="show('home')">‹</button><h2 id="chatTitle">消息</h2></div><div class="small" id="status">本地模式</div><div id="messages" class="chat"></div><div class="row"><input id="msgInput" placeholder="说点什么…" onkeydown="if(event.key==='Enter')sendMsg()"><button onclick="sendMsg()">发送</button></div></section>
<section id="mem" class="screen"><div class="top"><button class="ghost" onclick="show('home')">‹</button><h2>记忆</h2></div><p class="small">会一直记着的事</p><div id="memList"></div><div class="card"><textarea id="memText" placeholder="例如：我喜欢雨天"></textarea><button onclick="addMemory()">保存记忆</button></div></section>
<section id="persona" class="screen"><div class="top"><button class="ghost" onclick="show('home')">‹</button><h2>人设卡</h2></div><div id="personaForm"></div><button onclick="savePersona()">保存并生效</button> <label class="btn" style="display:inline-block">导入角色卡<input class="hidden" type="file" accept=".json,.txt" onchange="importPersona(event)"></label></section>
<section id="world" class="screen"><div class="top"><button class="ghost" onclick="show('home')">‹</button><h2>世界书</h2></div><div id="worldList"></div><button onclick="addWorld()">新增设定</button> <button onclick="exportWorld()">导出 JSON</button><label class="btn" style="display:inline-block">导入 JSON<input class="hidden" type="file" accept=".json" onchange="importWorld(event)"></label></section>
<section id="gallery" class="screen"><div class="top"><button class="ghost" onclick="show('home')">‹</button><h2>相册</h2></div><label class="btn" style="display:inline-block">导入图片<input class="hidden" type="file" accept="image/*" multiple onchange="importImages(event)"></label><div id="photos" class="thumbs"></div></section>
<section id="music" class="screen"><div class="top"><button class="ghost" onclick="show('home')">‹</button><h2>音乐</h2></div><label class="btn" style="display:inline-block">导入音频<input class="hidden" type="file" accept="audio/*" multiple onchange="importAudio(event)"></label><div id="tracks"></div></section>
<section id="settings" class="screen"><div class="top"><button class="ghost" onclick="show('home')">‹</button><h2>设置</h2></div><label>他的名字<input id="setName"></label><label>桌面底部文字<input id="setFoot"></label><label>最近上下文条数<input id="setCtx" type="number"></label><label>接口地址<input id="setUrl" placeholder="https://..."></label><label>模型名<input id="setModel"></label><label>钥匙<input id="setKey" type="password"></label><label>随机性<input id="setTemp" type="range" min="0" max="2" step=".1"></label><button onclick="saveSettings()">保存设置</button> <button class="danger" onclick="wipe()">清空全部</button><p class="small" id="stats"></p></section>
<nav class="bar"><button onclick="show('home')">⌂<br>桌面</button><button onclick="show('chat')">✉<br>消息</button><button onclick="show('mem')">♡<br>记忆</button><button onclick="show('settings')">⚙<br>设置</button></nav></div>
<script>
const K='xiaoshouji-v1';let state=load();function load(){try{return Object.assign({name:'TA',foot:'只在这里，慢慢说。',ctx:8,messages:[{role:'them',text:'你好，我在这里。'}],memories:[],persona:{name:'',call:'',style:'',catch:'',avoid:'',first:'',more:''},world:[],settings:{url:'',model:'',key:'',temp:0.7}},JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){return {name:'TA',foot:'',ctx:8,messages:[],memories:[],persona:{},world:[],settings:{}}}}function save(){try{localStorage.setItem(K,JSON.stringify(state))}catch(e){alert('保存失败：'+e.message)}}
const icons={chat:['✉','消息'],gallery:['▧','相册'],music:['♫','音乐'],mem:['♡','记忆'],persona:['♙','人设卡'],world:['◎','世界书'],settings:['⚙','设置']};function init(){grid.innerHTML=Object.entries(icons).map(([id,v])=>`<button class="tile" onclick="show('${id}')"><b>${v[0]}</b>${v[1]}</button>`).join('');homefoot.textContent=state.foot;chatTitle.textContent=state.name+' · 消息';renderAll();setInterval(()=>{let d=new Date();clock.textContent=d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});date.textContent=d.toLocaleDateString('zh-CN',{weekday:'long',month:'long',day:'numeric'})},1000)}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');renderAll()}function renderAll(){messages.innerHTML=state.messages.map(m=>`<div class="bubble ${m.role==='me'?'me':'them'}">${esc(m.text)}<div class="meta">${m.role==='me'?'我':state.name}</div></div>`).join('');memList.innerHTML=state.memories.map((m,i)=>`<div class="card">${esc(m)} <button class="danger" onclick="state.memories.splice(${i},1);save();renderAll()">删</button></div>`).join('');personaForm.innerHTML=Object.entries({name:'他叫什么',call:'怎么称呼我',style:'性子和说话方式',catch:'口头禅',avoid:'绝不说的话',first:'开口第一句',more:'还要记住的事'}).map(([k,l])=>`<label>${l}<textarea id="p_${k}">${esc(state.persona[k]||'')}</textarea></label>`).join('');worldList.innerHTML=state.world.map((w,i)=>`<div class="card"><input value="${esc(w.title)}" onchange="state.world[${i}].title=this.value;save()"><input value="${esc(w.keys)}" placeholder="关键词，用逗号分隔" onchange="state.world[${i}].keys=this.value;save()"><textarea onchange="state.world[${i}].body=this.value;save()">${esc(w.body)}</textarea><label><input type="checkbox" ${w.always?'checked':''} onchange="state.world[${i}].always=this.checked;save()"> 常驻</label><button class="danger" onclick="state.world.splice(${i},1);save();renderAll()">删除</button></div>`).join('');setName.value=state.name;setFoot.value=state.foot;setCtx.value=state.ctx;setUrl.value=state.settings.url||'';setModel.value=state.settings.model||'';setKey.value=state.settings.key||'';setTemp.value=state.settings.temp??.7;stats.textContent=`消息 ${state.messages.length} 条 · 记忆 ${state.memories.length} 条`}
function sendMsg(){let v=msgInput.value.trim();if(!v)return;state.messages.push({role:'me',text:v});msgInput.value='';save();renderAll();setTimeout(async()=>{let reply=localReply(v);if(state.settings.url){try{let u=state.settings.url.replace(/\/$/,'');if(!u.includes('/chat/completions'))u+='/v1/chat/completions';let r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json',...(state.settings.key?{Authorization:'Bearer '+state.settings.key}:{})},body:JSON.stringify({model:state.settings.model||'gpt-4o-mini',messages:[...state.messages.slice(-state.ctx),{role:'system',content:JSON.stringify(state.persona)}],temperature:+state.settings.temp||.7})});let j=await r.json();reply=j.choices?.[0]?.message?.content||reply;status.textContent='接口模式'}catch(e){status.textContent='接口未连通，已退回本地：'+e.message}}state.messages.push({role:'them',text:reply});if(/^记住[：:]/.test(v))state.memories.push(v.replace(/^记住[：:]/,''));save();renderAll()},700)}function localReply(v){if(v.includes('你好'))return '你好呀，我一直在听。';if(v.includes('谢谢'))return '不用客气。';if(v.includes('晚安'))return '晚安，做个好梦。';return state.persona.first||'嗯，我记住了。'}
function addMemory(){let v=memText.value.trim();if(v){state.memories.push(v);memText.value='';save();renderAll()}}function savePersona(){for(let k of ['name','call','style','catch','avoid','first','more'])state.persona[k]=document.getElementById('p_'+k).value;state.name=state.persona.name||state.name;save();renderAll();alert('已保存并生效')}function importPersona(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);state.persona=Object.assign(state.persona,x);save();renderAll()}catch(_){alert('不是有效 JSON 角色卡')}};r.readAsText(f)}function addWorld(){state.world.push({title:'新设定',keys:'',body:'',always:false});save();renderAll()}function exportWorld(){download(JSON.stringify(state.world), 'worldbook.json','application/json')}function importWorld(e){let r=new FileReader();r.onload=()=>{try{state.world=JSON.parse(r.result);save();renderAll()}catch(_){alert('导入失败')}};r.readAsText(e.target.files[0])}
function saveSettings(){state.name=setName.value;state.foot=setFoot.value;state.ctx=+setCtx.value||8;state.settings={url:setUrl.value,model:setModel.value,key:setKey.value,temp:+setTemp.value};save();renderAll();alert('设置已保存')}function wipe(){if(confirm('确定清空这台手机里的全部数据吗？')){localStorage.removeItem(K);location.reload()}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function download(s,n,t){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:t}));a.download=n;a.click()}function importImages(e){for(let f of e.target.files){let r=new FileReader();r.onload=()=>{let d=JSON.parse(localStorage.getItem('photos')||'[]');d.push(r.result);localStorage.setItem('photos',JSON.stringify(d));photos.innerHTML=d.map(x=>`<img src="${x}">`).join('')};r.readAsDataURL(f)}}function importAudio(e){for(let f of e.target.files){let u=URL.createObjectURL(f);tracks.innerHTML+=`<div class="card">${esc(f.name)}<audio controls src="${u}"></audio></div>`}}init();
</script></body></html>
