<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>网易云登录测试｜喂喂机</title><style>body{margin:0;background:#f7f5f3;color:#292725;font:15px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}.wrap{max-width:540px;margin:auto;padding:32px 20px 70px}h1{font-size:24px;margin:0 0 8px}p{color:#777;line-height:1.7}.card{background:white;border:1px solid #eae5e0;border-radius:20px;padding:22px;margin:20px 0;box-shadow:0 8px 24px #00000005}label{display:block;margin:12px 0 8px;font-weight:600}input{width:100%;box-sizing:border-box;border:1px solid #d7d0ca;border-radius:12px;padding:14px;font-size:15px;background:#fff;color:#222}button{border:0;border-radius:12px;background:#2f2d2c;color:#fff;padding:13px 16px;font-size:15px;margin:12px 8px 0 0;cursor:pointer}button.secondary{background:#e9e6e3;color:#333}button:disabled{opacity:.5}#qr{display:flex;justify-content:center;margin:22px auto}#qr img{width:220px;height:220px}#status{white-space:pre-wrap;word-break:break-word;background:#f5f2ef;padding:14px;border-radius:12px;min-height:28px;line-height:1.6}.note{font-size:13px}.hidden{display:none}ul{padding-left:22px;line-height:1.8}</style></head><body><main class="wrap"><h1>网易云扫码登录测试</h1><p>独立测试页面，不修改喂喂机 musicroom。</p><div class="card"><label for="token">Render 的 MUSIC_AUTH_TOKEN</label><input id="token" type="password" placeholder="仅在本机输入，不会保存到网页服务器" autocomplete="off"/><p class="note">请在 Render 的 Environment 页面自行查看密钥，切勿截图或发给别人。密钥只用于向你自己的 Render 后端发请求，不存储在本地缓存。</p><button id="start">生成登录二维码</button><button id="clear" class="secondary">清除密钥</button><div id="qr"></div><p id="scanHint" class="hidden">用网易云音乐 App 扫描上方二维码并确认。只有一台手机时，可在另一台设备打开此页面展示二维码。</p><div id="status" role="status">等待开始</div></div><div class="card"><h2 style="font-size:18px">登录后测试</h2><button id="profile">读取账号信息</button><button id="lists">读取我的歌单</button><div id="result" style="margin-top:14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.7"></div></div><p class="note">本页面需要放在 https://zhuanjiaoyudaoxian.github.io 下访问，直接在“文件”App 中打开会遇到跨域限制。二维码在浏览器内生成；不经过第三方二维码生成服务。扫码凭证可能在 Render 免费实例重启后丢失。</p></main><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>
(()=>{'use strict';const API='https://weiwei-netease-python.onrender.com',el=id=>document.getElementById(id);let key='',timer=null,busy=false;const status=s=>el('status').textContent=s;function stop(){if(timer)clearInterval(timer);timer=null}async function req(path){const token=el('token').value.trim();if(!token)throw Error('请先输入 MUSIC_AUTH_TOKEN');const response=await fetch(API+path,{headers:{'X-Auth-Token':token},cache:'no-store'});const data=await response.json().catch(()=>({error:'服务器没有返回 JSON'}));if(!response.ok)throw Error('HTTP '+response.status+'：'+(data.error||JSON.stringify(data)));return data}async function poll(){if(!key||busy)return;busy=true;try{const d=await req('/music/netease/qr/check?key='+encodeURIComponent(key));const c=Number(d.code);if(c===801)status('等待扫码…');else if(c===802)status('已扫码，请在网易云音乐 App 中确认');else if(c===803){status('登录成功！'+(d.nickname?' 用户：'+d.nickname:''));stop();key=''}else if(c===800){status('二维码已过期，请重新生成');stop();key=''}else status('扫码状态：'+JSON.stringify(d))}catch(e){status('检查失败：'+e.message)}finally{busy=false}}el('start').onclick=async()=>{stop();key='';el('qr').replaceChildren();status('正在请求二维码…');try{const d=await req('/music/netease/qr/new');if(!d.key||!d.url)throw Error('后端没有返回二维码地址');if(typeof QRCode==='undefined')throw Error('二维码脚本加载失败，请检查网络后刷新');key=d.key;new QRCode(el('qr'),{text:d.url,width:220,height:220,correctLevel:QRCode.CorrectLevel.M});el('scanHint').classList.remove('hidden');status('二维码已生成，请使用网易云音乐 App 扫码');timer=setInterval(poll,3000)}catch(e){status('生成失败：'+e.message)}};el('clear').onclick=()=>{stop();key='';el('token').value='';el('qr').replaceChildren();el('result').textContent='';status('已清除')};el('profile').onclick=async()=>{el('result').textContent='正在读取…';try{const d=await req('/music/netease/profile');el('result').textContent=JSON.stringify(d,null,2)}catch(e){el('result').textContent=e.message}};el('lists').onclick=async()=>{el('result').textContent='正在读取…';try{const d=await req('/music/netease/playlists');el('result').textContent=JSON.stringify(d,null,2)}catch(e){el('result').textContent=e.message}};window.addEventListener('pagehide',stop)})();
</script></body></html>
