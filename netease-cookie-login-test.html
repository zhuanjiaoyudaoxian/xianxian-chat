<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>网易云备用登录测试</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f7f6f4;color:#242424;margin:0;padding:22px}main{max-width:560px;margin:auto}section{background:#fff;border:1px solid #e7e4e0;border-radius:20px;padding:22px;margin:18px 0}h1{font-size:23px}h2{font-size:17px}p{color:#686868;line-height:1.7}label{display:block;margin:15px 0 6px}input{box-sizing:border-box;width:100%;padding:14px;border:1px solid #ccc;border-radius:11px;font-size:16px}button{border:0;border-radius:11px;background:#292929;color:white;padding:13px 18px;margin:8px 8px 0 0;font-size:15px}button.secondary{background:#eae9e7;color:#292929}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f4f2;border-radius:10px;padding:14px;font-size:13px}small{color:#777}</style></head><body><main><h1>网易云备用登录测试</h1><p>仅供个人测试。页面不会把密钥或 Cookie 写入浏览器存储；提交后后端会保存网易云登录凭证。不要把填好的页面截图或共享给他人。</p><section><h2>1. 导入已有登录凭证</h2><label for="token">Render 的 MUSIC_AUTH_TOKEN</label><input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="只在你自己的设备输入"><label for="cookie">网易云 MUSIC_U（只填值或 MUSIC_U=...）</label><input id="cookie" type="password" autocomplete="off" spellcheck="false" placeholder="从你本人已登录的网易云网页版获取"><p><small>请勿将凭证提交到 GitHub 仓库或发到聊天中。只应在你信任的页面上输入。建议先确认地址栏是自己的 GitHub Pages 域名。</small></p><button id="login">验证并导入</button><button class="secondary" id="clear">清空输入</button><pre id="loginOut" aria-live="polite">等待操作</pre></section><section><h2>2. 登录后测试</h2><button id="profile">读取账号信息</button><button id="playlists">读取我的歌单</button><pre id="result" aria-live="polite">等待操作</pre></section></main><script>
const BASE='https://weiwei-netease-python.onrender.com';
const el=id=>document.getElementById(id);
function display(id,msg){el(id).textContent=msg}
async function request(path,opts={}){const token=el('token').value.trim();if(!token)throw Error('请先输入 MUSIC_AUTH_TOKEN');let response;try{response=await fetch(BASE+path,{...opts,headers:{'X-Auth-Token':token,...(opts.headers||{})},cache:'no-store'})}catch(e){throw Error('请求失败：请确认 Render 已部署且 APP_ORIGIN 正确（'+e.message+'）')}let data;try{data=await response.json()}catch{throw Error('服务返回非 JSON，HTTP '+response.status)}if(!response.ok||data.ok===false)throw Error('HTTP '+response.status+'：'+(data.error||data.msg||data.message||'请求失败'));return data}
el('login').onclick=async()=>{const cookie=el('cookie').value.trim();if(!cookie){display('loginOut','请先输入 MUSIC_U');return}display('loginOut','正在验证网易云登录状态…');try{const d=await request('/music/netease/login/cookie',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cookie})});display('loginOut','验证成功！昵称：'+(d.nickname||'未返回')+'\n账号 ID：'+(d.userId||'未返回'));el('cookie').value=''}catch(e){display('loginOut',e.message)}};
el('clear').onclick=()=>{el('token').value='';el('cookie').value='';display('loginOut','已清空输入')};
el('profile').onclick=async()=>{display('result','正在读取…');try{const d=await request('/music/netease/profile');display('result',JSON.stringify(d,null,2))}catch(e){display('result',e.message)}};
el('playlists').onclick=async()=>{display('result','正在读取…');try{const d=await request('/music/netease/playlists');display('result',JSON.stringify(d,null,2))}catch(e){display('result',e.message)}};
</script></body></html>
